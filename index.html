<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>TV Institucional</title>

<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{

    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    cursor:none;

}

body{

    display:flex;
    justify-content:center;
    align-items:center;

}

video{

    width:100vw;
    height:100vh;
    background:#000;
    object-fit:contain;
    pointer-events:none;
    outline:none;

}

/* TVs 4K */

@media (min-width:3000px){

video{

    object-fit:cover;

}

}

</style>

</head>

<body>

<video
id="player"
autoplay
muted
playsinline
webkit-playsinline
preload="auto"
disablePictureInPicture
controlsList="nodownload nofullscreen noplaybackrate noremoteplayback">
</video>

<script>

const videos=[

"video1.mp4",
"video2.mp4"

];

let indice=0;

const player=document.getElementById("player");

player.controls=false;
player.removeAttribute("controls");

function ajustarTela(){

    if(window.innerWidth>=3000){

        player.style.objectFit="cover";

    }else{

        player.style.objectFit="contain";

    }

}

function urlSemCache(video){

    return video+"?v="+Date.now();

}

function tocarVideo(){

    player.pause();

    player.src=urlSemCache(videos[indice]);

    player.load();

    player.play().catch(function(erro){

        console.log("Erro:",erro);

        setTimeout(tocarVideo,3000);

    });

}

function proximoVideo(){

    indice++;

    if(indice>=videos.length){

        indice=0;

    }

    tocarVideo();

}

player.addEventListener("ended",proximoVideo);

player.addEventListener("error",function(){

    console.log("Erro no vídeo.");

    proximoVideo();

});

player.addEventListener("loadedmetadata",function(){

    player.controls=false;
    player.removeAttribute("controls");

});

window.addEventListener("load",function(){

    ajustarTela();

    tocarVideo();

});

window.addEventListener("resize",ajustarTela);

document.addEventListener("contextmenu",function(e){

    e.preventDefault();

});

document.addEventListener("keydown",function(e){

    e.preventDefault();

});

document.addEventListener("dragstart",function(e){

    e.preventDefault();

});

document.addEventListener("selectstart",function(e){

    e.preventDefault();

});

function entrarTelaCheia(){

    const doc=document.documentElement;

    if(doc.requestFullscreen){

        doc.requestFullscreen();

    }else if(doc.webkitRequestFullscreen){

        doc.webkitRequestFullscreen();

    }

}

setTimeout(entrarTelaCheia,1500);

setInterval(function(){

    location.reload();

},3600000);

</script>

</body>

</html>
